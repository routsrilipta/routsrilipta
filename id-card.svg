<svg width="320" height="420" viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#0d0517"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#b6249b"/>
    </linearGradient>
  </defs>

  <!-- Fixed anchor clip at top -->
  <circle cx="160" cy="20" r="8" fill="#333"/>
  <rect x="150" y="10" width="20" height="16" rx="4" fill="#555"/>

  <!-- Swinging group: strap + card rotate together around anchor point (160,20) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-6 160 20; 6 160 20; -6 160 20"
      dur="2.8s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Lanyard strap -->
    <rect x="152" y="20" width="16" height="110" fill="url(#strapGrad)" rx="4"/>

    <!-- Card -->
    <g transform="translate(20,130)">
      <rect x="0" y="0" width="280" height="260" rx="18"
        fill="url(#cardBg)" stroke="#ff2d95" stroke-width="2"/>

      <!-- Punch hole -->
      <circle cx="140" cy="24" r="8" fill="#0d0517" stroke="#ff2d95" stroke-width="1.5"/>

      <!-- Avatar circle -->
      <circle cx="140" cy="95" r="45" fill="#2a1240" stroke="#ff2d95" stroke-width="2"/>
      <text x="140" y="105" font-family="Fira Code, monospace" font-size="34"
        fill="#ff2d95" text-anchor="middle">👨‍💻</text>

      <!-- Name -->
      <text x="140" y="170" font-family="Fira Code, monospace" font-size="20"
        font-weight="bold" fill="#ffffff" text-anchor="middle">Srilipta Rout</text>

      <!-- Title -->
      <text x="140" y="195" font-family="Fira Code, monospace" font-size="13"
        fill="#c084fc" text-anchor="middle">MCA 2nd year</text>

      <!-- Barcode-ish decoration -->
      <g transform="translate(50,220)">
        <rect x="0" y="0" width="3" height="24" fill="#ff2d95"/>
        <rect x="6" y="0" width="1.5" height="24" fill="#ff2d95"/>
        <rect x="11" y="0" width="4" height="24" fill="#ff2d95"/>
        <rect x="19" y="0" width="2" height="24" fill="#ff2d95"/>
        <rect x="25" y="0" width="1.5" height="24" fill="#ff2d95"/>
        <rect x="30" y="0" width="3" height="24" fill="#ff2d95"/>
        <rect x="37" y="0" width="2" height="24" fill="#ff2d95"/>
        <rect x="44" y="0" width="4" height="24" fill="#ff2d95"/>
        <rect x="52" y="0" width="1.5" height="24" fill="#ff2d95"/>
        <rect x="58" y="0" width="3" height="24" fill="#ff2d95"/>
        <rect x="65" y="0" width="2" height="24" fill="#ff2d95"/>
        <rect x="72" y="0" width="4" height="24" fill="#ff2d95"/>
        <rect x="80" y="0" width="1.5" height="24" fill="#ff2d95"/>
        <rect x="86" y="0" width="3" height="24" fill="#ff2d95"/>
        <rect x="93" y="0" width="2" height="24" fill="#ff2d95"/>
        <rect x="100" y="0" width="4" height="24" fill="#ff2d95"/>
        <rect x="108" y="0" width="1.5" height="24" fill="#ff2d95"/>
        <rect x="113" y="0" width="3" height="24" fill="#ff2d95"/>
        <rect x="120" y="0" width="2" height="24" fill="#ff2d95"/>
        <rect x="127" y="0" width="4" height="24" fill="#ff2d95"/>
        <rect x="135" y="0" width="1.5" height="24" fill="#ff2d95"/>
        <rect x="140" y="0" width="3" height="24" fill="#ff2d95"/>
        <rect x="147" y="0" width="2" height="24" fill="#ff2d95"/>
        <rect x="154" y="0" width="4" height="24" fill="#ff2d95"/>
        <rect x="162" y="0" width="1.5" height="24" fill="#ff2d95"/>
        <rect x="167" y="0" width="3" height="24" fill="#ff2d95"/>
      </g>

      <!-- Footer quote -->
      <text x="140" y="248" font-family="Fira Code, monospace" font-size="10"
        fill="#888" text-anchor="middle">roll no-70</text>
    </g>
  </g>
</svg>
